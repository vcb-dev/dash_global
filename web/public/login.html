<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập — Pancake BI</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Pancake BI</h1>
      <p>Đăng nhập để xem dashboard giống Power BI (doanh thu, tồn kho, ETA, hành động tuần).</p>
      <button class="google-btn" id="googleBtn" style="display:none">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16.1 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.5 7.3l.1.1 6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
        Đăng nhập với Google
      </button>
      <div class="dev-box" id="devBox" style="display:none">
        <div class="muted">Chưa cấu hình Google OAuth — dùng đăng nhập tạm (dev)</div>
        <input id="devEmail" type="email" placeholder="email@company.com" value="dev@local" />
        <button class="btn" id="devBtn" style="width:100%">Vào dashboard</button>
      </div>
      <p class="muted" id="hint" style="margin-top:16px"></p>
    </div>
  </div>
  <script>
    (async () => {
      const me = await fetch('/api/me').then((r) => r.json());
      if (me.user) { location.href = '/'; return; }
      if (me.google) {
        document.getElementById('googleBtn').style.display = 'flex';
        document.getElementById('googleBtn').onclick = () => { location.href = '/auth/google'; };
        document.getElementById('hint').textContent = 'Dùng tài khoản Google được cấp quyền.';
      }
      if (me.devLogin) {
        document.getElementById('devBox').style.display = 'block';
        document.getElementById('devBtn').onclick = async () => {
          const email = document.getElementById('devEmail').value;
          const res = await fetch('/auth/dev-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          if (!res.ok) { alert(await res.text()); return; }
          location.href = '/';
        };
      }
    })();
  </script>
</body>
</html>
